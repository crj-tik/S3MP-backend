        profile_version:
          description: "\u521B\u5EFA\u8BE5\u547D\u540D\u7A7A\u95F4\u65F6\u7684\u5171\
            \u4EAB profile \u7248\u672C\u3002"
          minimum: 1
          type: integer
        storage_namespace:
          description: "\u4E0D\u53EF\u53D8\u7684\u670D\u52A1\u7AEF\u5BF9\u8C61 Key\
            \ \u524D\u7F00\u3002"
          type: string
        storage_space_id:
          description: "\u8BE5\u5E94\u7528\u552F\u4E00\u903B\u8F91\u5B58\u50A8\u7A7A\
            \u95F4\u6807\u8BC6\u3002"
          format: uuid
          type: string
      required:
      - application_id
      - storage_space_id
      - storage_namespace
      - profile_version
      title: ApplicationStorageNamespace
      type: object
    ApplicationTakeover:
      additionalProperties: false
