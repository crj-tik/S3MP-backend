    \u4EA4 `X-S3MP-CSRF`\uFF0C\u670D\u52A1\u7AEF\u5E94\u7528\u8BBF\u95EE\u4F7F\u7528\
    \ API Key\u3002\u9519\u8BEF\u54CD\u5E94\u7EDF\u4E00\u8FD4\u56DE\u7A33\u5B9A\u7684\
    \ `code`\u3001\u53EF\u8BFB\u7684 `message` \u548C\u7528\u4E8E\u6392\u969C\u7684\
    \ `request_id`\uFF1B\u4EFB\u4F55\u4F1A\u8BDD\u503C\u3001API Key \u6216\u5B58\u50A8\
    \u51ED\u636E\u5747\u4E0D\u4F1A\u51FA\u73B0\u5728\u54CD\u5E94\u4E2D\u3002"
  title: S3MP API
  version: 1.1.0
