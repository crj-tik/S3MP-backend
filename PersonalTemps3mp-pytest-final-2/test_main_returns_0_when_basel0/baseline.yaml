          type: array
        query_parameter:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u201Cquery_parameter\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\
            \u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          title: Query Parameter
        resource:
          description: "\u201Cresource\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\u503C\
            \u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          title: Resource
          type: string
        used_by:
          description: "\u201Cused_by\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\u503C\
            \u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          items:
            type: string
