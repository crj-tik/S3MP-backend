          type: string
        source_id:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u6E90\u8D44\u6E90\u7684\u670D\u52A1\u7AEF\u552F\u4E00\u6807\
            \u8BC6\u3002"
          title: Source Id
        source_type:
          description: "\u6388\u6743\u3001\u5BA1\u8BA1\u6216\u64CD\u4F5C\u6765\u6E90\
            \u7684\u5206\u7C7B\u3002"
