            \u6807\u8BC6\u3002"
          title: Principal Id
          type: string
        principal_type:
          description: "\u201Cprincipal_type\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\
            \u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
