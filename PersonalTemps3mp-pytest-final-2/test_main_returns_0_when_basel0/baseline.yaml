            \u79F0\u3002"
          title: Label
          type: string
        terminal:
          description: "\u662F\u5426\u4E3A\u4E0D\u53EF\u7EE7\u7EED\u6D41\u8F6C\u7684\
            \u7EC8\u6001\u3002"
          title: Terminal
          type: boolean
        transitions:
          description: "\u5F53\u524D\u503C\u5141\u8BB8\u8F6C\u6362\u5230\u7684\u4E0B\
            \u4E00\u72B6\u6001\u503C\uFF1B\u7A7A\u6570\u7EC4\u8868\u793A\u6CA1\u6709\
            \u53EF\u7528\u8F6C\u6362\u3002"
          items:
            type: string
          title: Transitions
          type: array
        value:
          description: "\u7A33\u5B9A\u7684\u7A0B\u5E8F\u503C\uFF1B\u524D\u7AEF\u8BF7\
            \u6C42\u548C\u72B6\u6001\u5224\u65AD\u4F7F\u7528\u6B64\u503C\u3002"
          title: Value
          type: string
      required:
      - value
      - label
      - description
      - terminal
      title: CatalogItem
      type: object
    DecisionSource:
      additionalProperties: false
      properties:
        effect:
          description: "\u89D2\u8272\u7ED1\u5B9A\u5BF9\u6743\u9650\u4EA7\u751F\u7684\
            \u5141\u8BB8\u6216\u62D2\u7EDD\u6548\u679C\u3002"
          enum:
          - allow
          - deny
          title: Effect
          type: string
        reason_code:
          description: "\u53EF\u4F9B\u7A0B\u5E8F\u5904\u7406\u7684\u7A33\u5B9A\u539F\
            \u56E0\u4EE3\u7801\u3002"
