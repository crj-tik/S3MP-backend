      type: object
    AuthorizationDecisionResponse:
      additionalProperties: false
      properties:
        authorization_version:
          description: "\u6388\u6743\u72B6\u6001\u7248\u672C\uFF1B\u53D8\u5316\u540E\
            \u65E7\u4F1A\u8BDD\u548C\u7F13\u5B58\u4F1A\u88AB\u91CD\u65B0\u9A8C\u8BC1\
            \u3002"
          title: Authorization Version
          type: integer
        decision:
          description: "\u672C\u6B21\u6388\u6743\u6A21\u62DF\u5F97\u51FA\u7684\u5141\
            \u8BB8\u6216\u62D2\u7EDD\u51B3\u5B9A\u3002"
          enum:
          - allow
          - deny
          title: Decision
          type: string
        evaluated_at:
          description: "\u672C\u6B21\u6743\u9650\u6216\u72B6\u6001\u8BA1\u7B97\u5B8C\
            \u6210\u7684\u65F6\u95F4\uFF0C\u91C7\u7528 UTC RFC 3339 \u683C\u5F0F\u3002"
          format: date-time
          title: Evaluated At
          type: string
        permission:
          description: "\u9700\u8981\u5224\u5B9A\u3001\u6388\u4E88\u6216\u6A21\u62DF\
            \u7684\u5355\u4E2A\u6743\u9650\u540D\u79F0\u3002"
          title: Permission
          type: string
        reason_code:
          description: "\u53EF\u4F9B\u7A0B\u5E8F\u5904\u7406\u7684\u7A33\u5B9A\u539F\
            \u56E0\u4EE3\u7801\u3002"
          title: Reason Code
          type: string
        sources:
          description: "\u7528\u4E8E\u5F97\u51FA\u5F53\u524D\u6743\u9650\u6216\u7ED3\
            \u679C\u7684\u6765\u6E90\u5217\u8868\u3002"
          items:
            $ref: '#/components/schemas/DecisionSource'
          title: Sources
          type: array
      required:
      - permission
      - decision
      - reason_code
      - authorization_version
      - evaluated_at
      - sources
      title: AuthorizationDecisionResponse
      type: object
    CatalogDescriptor:
      additionalProperties: false
      description: Declares where a catalog enum is used by the public API.
