          type: string
      required:
      - source_type
      - source_id
      - effect
      - reason_code
      title: DecisionSource
      type: object
    DirectUploadCreate:
      additionalProperties: false
      properties:
        checksum:
          anyOf:
          - maxLength: 512
            type: string
          - type: 'null'
          description: "\u5185\u5BB9\u6821\u9A8C\u548C\uFF0C\u7528\u4E8E\u9A8C\u8BC1\
            \u4E0A\u4F20\u6570\u636E\u7684\u5B8C\u6574\u6027\u3002"
          title: Checksum
        content_length:
          description: "\u5BF9\u8C61\u5B9E\u9645\u5185\u5BB9\u957F\u5EA6\uFF0C\u5355\
            \u4F4D\u4E3A\u5B57\u8282\u3002"
          minimum: 0.0
          title: Content Length
