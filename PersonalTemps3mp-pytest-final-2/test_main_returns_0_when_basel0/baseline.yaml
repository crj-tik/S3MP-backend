          description: "storage_space \u8986\u76D6\u5E94\u7528\u5168\u90E8\u8DEF\u5F84\
            \uFF1Bdirectory \u4EC5\u8986\u76D6 canonical_prefix\u3002"
          enum:
          - storage_space
          - directory
          type: string
      required:
      - type
      - storage_space_id
      title: ApplicationPathGrant
      type: object
    ApplicationResponse:
      description: "\u79DF\u6237\u5185\u5E94\u7528\u7684\u516C\u5F00\u7BA1\u7406\u4FE1\
        \u606F\u3002"
      properties:
        authorization_version:
          anyOf:
          - type: integer
          - type: 'null'
          description: "\u6388\u6743\u72B6\u6001\u7248\u672C\uFF1B\u53D8\u5316\u540E\
            \u65E7\u4F1A\u8BDD\u548C\u7F13\u5B58\u4F1A\u88AB\u91CD\u65B0\u9A8C\u8BC1\
            \u3002"
          title: Authorization Version
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: "\u8D44\u6E90\u521B\u5EFA\u65F6\u95F4\uFF0C\u91C7\u7528 UTC\
            \ RFC 3339 \u683C\u5F0F\u3002"
          title: Created At
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: "\u201Cdeleted_at\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\
            \u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          title: Deleted At
        deleted_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: "\u201Cdeleted_by\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\
            \u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          title: Deleted By
        deletion_reason:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u201Cdeletion_reason\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\
            \u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          title: Deletion Reason
        id:
          description: "\u8D44\u6E90\u7684\u670D\u52A1\u7AEF\u552F\u4E00\u6807\u8BC6\
            \u3002"
          format: uuid
          title: Id
          type: string
        name:
          description: "\u8D44\u6E90\u540D\u79F0\uFF0C\u5728\u6240\u5C5E\u79DF\u6237\
            \u8303\u56F4\u5185\u4F7F\u7528\u3002"
          title: Name
          type: string
        owners:
          description: "\u201Cowners\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\u53D6\u503C\
            \u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\u3002"
          items:
            additionalProperties:
              type: string
            type: object
          title: Owners
          type: array
        principal_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: "\u79DF\u6237\u4E3B\u4F53\u7684\u670D\u52A1\u7AEF\u552F\u4E00\
            \u6807\u8BC6\u3002"
          title: Principal Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u8D44\u6E90\u5F53\u524D\u751F\u547D\u5468\u671F\u72B6\u6001\
            \u3002"
          title: Status
        storage_namespace:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u5E94\u7528\u4E0D\u53EF\u53D8\u7684\u5171\u4EAB Bucket \u547D\
            \u540D\u7A7A\u95F4\uFF1B\u4E0E\u76F8\u5BF9\u5BF9\u8C61\u8DEF\u5F84\u5171\
            \u540C\u6D3E\u751F\u7269\u7406\u5BF9\u8C61 Key\u3002"
          title: Storage Namespace
        takeover_required:
          default: false
          description: "\u201Ctakeover_required\u201D\u5B57\u6BB5\uFF1B\u5177\u4F53\
            \u53D6\u503C\u548C\u7EA6\u675F\u89C1\u5F53\u524D\u8D44\u6E90\u8BF4\u660E\
            \u3002"
          title: Takeover Required
          type: boolean
        tenant_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: "\u79DF\u6237\u7684\u670D\u52A1\u7AEF\u552F\u4E00\u6807\u8BC6\
            \u3002"
          title: Tenant Id
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: "\u8D44\u6E90\u6700\u8FD1\u66F4\u65B0\u65F6\u95F4\uFF0C\u91C7\
            \u7528 UTC RFC 3339 \u683C\u5F0F\u3002"
          title: Updated At
      required:
      - id
      - name
      title: ApplicationResponse
      type: object
    ApplicationStatus:
      enum:
      - active
      - suspended
      - pending_takeover
      - deleted
