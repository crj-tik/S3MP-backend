      type: string
    ApplicationStorageNamespace:
      description: "\u7531\u670D\u52A1\u7AEF\u56FA\u5B9A\u7684\u5E94\u7528\u5B58\u50A8\
        \u547D\u540D\u7A7A\u95F4\uFF1B\u8C03\u7528\u65B9\u53EA\u80FD\u63D0\u4F9B\u76F8\
        \u5BF9\u5BF9\u8C61\u8DEF\u5F84\uFF0C\u4E0D\u80FD\u63D0\u4F9B\u7269\u7406 Key\u3002"
      properties:
        application_id:
          description: "\u547D\u540D\u7A7A\u95F4\u6240\u5C5E\u5E94\u7528\u6807\u8BC6\
            \u3002"
          format: uuid
