          type: array
      required:
      - domain
      - resource
      - field
      - items
      title: CatalogDescriptor
      type: object
    CatalogItem:
      additionalProperties: false
      properties:
        description:
          description: "\u8BE5\u503C\u7684\u4E1A\u52A1\u542B\u4E49\u548C\u4F7F\u7528\
            \u8FB9\u754C\u3002"
