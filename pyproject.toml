[project]
name = "s3mp"
version = "0.1.0"
description = "S3MP backend service"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2",
  "defusedxml>=0.7,<1",
  "elasticsearch[async]>=8.17,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pyyaml>=6.0,<7",
  "types-pyyaml>=6.0,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3mp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=tests/.artifacts/pytest -o cache_dir=tests/.artifacts/pytest-cache"
testpaths = ["tests"]
norecursedirs = [".artifacts", "__pycache__"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
cache-dir = "tests/.artifacts/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/test_infra_config.py" = ["S106"]
"tests/test_sensitive_data_hygiene.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
cache_dir = "tests/.artifacts/mypy"

[tool.uv]
default-groups = ["dev"]
