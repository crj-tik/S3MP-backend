openapi: 3.1.0
info:
  title: S3MP API
  version: 1.0.0
  summary: Tenant-isolated identity, authorization and private object storage API.
  description: The normative API contract. See api-conventions.md, error-codes.yaml and permission-catalog.yaml.
servers:
  - url: /
security:
  - session_cookie: []
  - s3mp_key: []
tags:
  - {name: Context}
  - {name: Users}
  - {name: Members}
  - {name: Groups}
  - {name: Roles}
  - {name: Authorization}
  - {name: Applications}
  - {name: API Keys}
  - {name: Storage}
  - {name: Files}
  - {name: Uploads}
  - {name: Multipart}
  - {name: Quotas}
  - {name: Audit}
paths:
  /api/v1/me:
    get:
      tags: [Context]
      operationId: get_me
      summary: Get the authenticated principal and tenant context
      responses:
        '200': {description: Current context, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}, examples: {success: {$ref: '#/components/examples/MeSuccess'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/MembershipInactive'}
  /api/v1/users:
    get:
      tags: [Users]
      operationId: list_users
      summary: List user identities visible in the current tenant
      x-permission: members.read
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: User page, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /api/v1/users/{user_id}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get:
      tags: [Users]
      operationId: get_user
      x-permission: members.read
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/members:
    get:
      tags: [Members]
      operationId: list_members
      x-permission: members.read
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Membership page, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPage'}, examples: {empty: {$ref: '#/components/examples/EmptyPage'}}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
    post:
      tags: [Members]
      operationId: create_member
      summary: Add an existing or invited user to the tenant
      x-permission: members.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipCreate'}}}}
      responses:
        '201': {description: Membership created, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/members/{membership_id}:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    get:
      tags: [Members]
      operationId: get_member
      x-permission: members.read
      responses:
        '200': {description: Membership, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Members]
      operationId: update_member
      summary: Change membership status; suspension immediately revokes authority
      x-permission: members.manage
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipUpdate'}}}}
      responses:
        '200': {description: Updated membership, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/EtagRequired'}
        '412': {$ref: '#/components/responses/EtagMismatch'}
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: list_groups
      x-permission: groups.read
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Group page, content: {application/json: {schema: {$ref: '#/components/schemas/GroupPage'}}}}
    post:
      tags: [Groups]
      operationId: create_group
      x-permission: groups.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupWrite'}}}}
      responses:
        '201': {description: Group created, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/groups/{group_id}:
    parameters: [{$ref: '#/components/parameters/GroupId'}]
    get:
      tags: [Groups]
      operationId: get_group
      x-permission: groups.read
      responses:
        '200': {description: Group, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Groups]
      operationId: update_group
      x-permission: groups.manage
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupWrite'}}}}
      responses:
        '200': {description: Updated group, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        '428': {$ref: '#/components/responses/EtagRequired'}
        '412': {$ref: '#/components/responses/EtagMismatch'}
    delete:
      tags: [Groups]
      operationId: delete_group
      x-permission: groups.manage
      responses:
        '204': {description: Group deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/groups/{group_id}/members:
    parameters: [{$ref: '#/components/parameters/GroupId'}]
    get:
      tags: [Groups]
      operationId: list_group_members
      x-permission: groups.read
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Membership page, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPage'}}}}
    post:
      tags: [Groups]
      operationId: add_group_member
      x-permission: groups.manage
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [membership_id], properties: {membership_id: {$ref: '#/components/schemas/Id'}}}}}}
      responses:
        '204': {description: Member added}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/groups/{group_id}/members/{membership_id}:
    parameters: [{$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/MembershipId'}]
    delete:
      tags: [Groups]
      operationId: remove_group_member
      x-permission: groups.manage
      responses:
        '204': {description: Member removed}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/roles:
    get:
      tags: [Roles]
      operationId: list_roles
      x-permission: roles.read
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Role page, content: {application/json: {schema: {$ref: '#/components/schemas/RolePage'}}}}
    post:
      tags: [Roles]
      operationId: create_role
      x-permission: roles.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}}}}
      responses:
        '201': {description: Role created, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/roles/{role_id}:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
    get:
      tags: [Roles]
      operationId: get_role
      x-permission: roles.read
      responses:
        '200': {description: Role, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Roles]
      operationId: update_role
      x-permission: roles.manage
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}}}}
      responses:
        '200': {description: Updated role, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '428': {$ref: '#/components/responses/EtagRequired'}
        '412': {$ref: '#/components/responses/EtagMismatch'}
  /api/v1/role_bindings:
    get:
      tags: [Authorization]
      operationId: list_role_bindings
      x-permission: role_bindings.read
      parameters: [{name: principal_id, in: query, schema: {type: [string, 'null']}}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Binding page, content: {application/json: {schema: {$ref: '#/components/schemas/RoleBindingPage'}}}}
    post:
      tags: [Authorization]
      operationId: create_role_binding
      x-permission: role_bindings.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleBindingCreate'}}}}
      responses:
        '201': {description: Binding created, content: {application/json: {schema: {$ref: '#/components/schemas/RoleBinding'}}}}
        '403': {description: Delegation denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {denied: {$ref: '#/components/examples/DelegationDenied'}}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/role_bindings/{role_binding_id}:
    parameters: [{$ref: '#/components/parameters/RoleBindingId'}]
    get:
      tags: [Authorization]
      operationId: get_role_binding
      x-permission: role_bindings.read
      responses:
        '200': {description: Binding, content: {application/json: {schema: {$ref: '#/components/schemas/RoleBinding'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Authorization]
      operationId: revoke_role_binding
      x-permission: role_bindings.manage
      responses:
        '204': {description: Binding revoked}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/principals/{principal_id}/effective_permissions:
    parameters: [{$ref: '#/components/parameters/PrincipalId'}]
    get:
      tags: [Authorization]
      operationId: get_effective_permissions
      x-permission: authorization.explain
      parameters: [{name: storage_space_id, in: query, schema: {type: [string, 'null']}}, {name: object_key, in: query, schema: {type: [string, 'null']}}]
      responses:
        '200': {description: Effective permissions and sources, content: {application/json: {schema: {$ref: '#/components/schemas/EffectivePermissions'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/authorization/simulations:
    post:
      tags: [Authorization]
      operationId: simulate_authorization
      summary: Evaluate once without changing policy or access
      x-permission: authorization.simulate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationSimulationRequest'}}}}
      responses:
        '200': {description: Decision, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationDecision'}, examples: {deny: {$ref: '#/components/examples/SimulationDenied'}}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/applications:
    get:
      tags: [Applications]
      operationId: list_applications
      x-permission: applications.read
      security: [{session_cookie: []}]
      description: Human management endpoint. API-Key credentials are rejected with `403 permission_denied`.
      responses:
        '200': {description: Application page, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationPage'}}}}
    post:
      tags: [Applications]
      operationId: create_application
      x-permission: applications.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationCreate'}}}}
      responses:
        '201': {description: Application created, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/applications/{application_id}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      tags: [Applications]
      operationId: get_application
      x-permission: applications.read
      security: [{session_cookie: []}]
      responses:
        '200': {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Applications]
      operationId: update_application
      x-permission: applications.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationUpdate'}}}}
      responses:
        '200': {description: Updated application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/applications/{application_id}/takeover:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    post:
      tags: [Applications]
      operationId: takeover_application
      summary: Restore a pending application under the caller's ownership
      x-permission: applications.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationTakeover'}}}}
      responses:
        '200': {description: Application reactivated, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/applications/{application_id}/api_keys:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      tags: [API Keys]
      operationId: list_api_keys
      x-permission: api_keys.read
      security: [{session_cookie: []}]
      responses:
        '200': {description: Key metadata page, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyPage'}}}}
    post:
      tags: [API Keys]
      operationId: create_api_key
      summary: Issue a key; secret appears only in this response
      x-permission: api_keys.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreate'}}}}
      responses:
        '201': {description: One-time key credential, content: {application/json: {schema: {$ref: '#/components/schemas/IssuedApiKey'}, examples: {success: {$ref: '#/components/examples/ApiKeyIssued'}}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/api_keys/{api_key_id}:
    parameters: [{$ref: '#/components/parameters/ApiKeyId'}]
    get:
      tags: [API Keys]
      operationId: get_api_key
      x-permission: api_keys.read
      security: [{session_cookie: []}]
      responses:
        '200': {description: Non-secret key metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKey'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/api_keys/{api_key_id}/secret:
    parameters: [{$ref: '#/components/parameters/ApiKeyId'}]
    get:
      tags: [API Keys]
      operationId: get_api_key_secret
      deprecated: true
      summary: Always rejects because secrets are one-time values
      x-permission: api_keys.read
      security: [{session_cookie: []}]
      responses:
        '410': {description: Secret cannot be retrieved, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {expired: {$ref: '#/components/examples/SecretGone'}}}}}
  /api/v1/api_keys/{api_key_id}/rotations:
    parameters: [{$ref: '#/components/parameters/ApiKeyId'}]
    post:
      tags: [API Keys]
      operationId: rotate_api_key
      x-permission: api_keys.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [overlap_seconds], properties: {overlap_seconds: {type: integer, minimum: 0, maximum: 86400}}}}}}
      responses:
        '201': {description: Replacement one-time credential, content: {application/json: {schema: {$ref: '#/components/schemas/IssuedApiKey'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/api_keys/{api_key_id}/revocations:
    parameters: [{$ref: '#/components/parameters/ApiKeyId'}]
    post:
      tags: [API Keys]
      operationId: revoke_api_key
      x-permission: api_keys.manage
      security: [{session_cookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses:
        '200': {description: Revoked key and residual presigned exposure, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyRevocation'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/storage_connections:
    get:
      tags: [Storage]
      operationId: list_storage_connections
      x-permission: storage_connections.read
      responses:
        '200': {description: Redacted connection page, content: {application/json: {schema: {$ref: '#/components/schemas/StorageConnectionPage'}}}}
    post:
      tags: [Storage]
      operationId: create_storage_connection
      x-permission: storage_connections.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StorageConnectionCreate'}}}}
      responses:
        '201': {description: Connection created, content: {application/json: {schema: {$ref: '#/components/schemas/StorageConnection'}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/storage_connections/{connection_id}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    get:
      tags: [Storage]
      operationId: get_storage_connection
      x-permission: storage_connections.read
      responses:
        '200': {description: Redacted connection, content: {application/json: {schema: {$ref: '#/components/schemas/StorageConnection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/storage_connections/{connection_id}/probes:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      tags: [Storage]
      operationId: probe_storage_connection
      x-permission: storage_connections.manage
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {write_test_prefix: {$ref: '#/components/schemas/CanonicalPrefix'}}}}}}
      responses:
        '200': {description: Capability probe result, content: {application/json: {schema: {$ref: '#/components/schemas/StorageProbe'}}}}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /api/v1/storage_spaces:
    get:
      tags: [Storage]
      operationId: list_storage_spaces
      x-permission: storage_spaces.read
      responses:
        '200': {description: Space page, content: {application/json: {schema: {$ref: '#/components/schemas/StorageSpacePage'}}}}
    post:
      tags: [Storage]
      operationId: create_storage_space
      x-permission: storage_spaces.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StorageSpaceCreate'}}}}
      responses:
        '201': {description: Space created, content: {application/json: {schema: {$ref: '#/components/schemas/StorageSpace'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/storage_spaces/{space_id}:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    get:
      tags: [Storage]
      operationId: get_storage_space
      x-permission: storage_spaces.read
      responses:
        '200': {description: Storage space, content: {application/json: {schema: {$ref: '#/components/schemas/StorageSpace'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/storage_spaces/{space_id}/files:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    get:
      tags: [Files]
      operationId: list_files
      x-permission: files.list
      parameters: [{name: prefix, in: query, schema: {type: [string, 'null']}}]
      responses:
        '200': {description: Authorized visible objects, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FileObjectRuntime'}}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /api/v1/storage_spaces/{space_id}/files/{file_id}:
    parameters: [{$ref: '#/components/parameters/SpaceId'}, {$ref: '#/components/parameters/FileId'}]
    get:
      tags: [Files]
      operationId: get_file
      x-permission: files.read
      responses:
        '200': {description: Verified object metadata, content: {application/json: {schema: {$ref: '#/components/schemas/FileObjectRuntime'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Files]
      operationId: delete_file
      x-permission: files.delete
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Durable deletion intent accepted; reconciliation performs the provider delete, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteQueued'}}}}
        '412': {$ref: '#/components/responses/EtagMismatch'}
  /api/v1/storage_spaces/{space_id}/file_operations:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    post:
      tags: [Files]
      operationId: create_file_operation
      summary: Copy, move, or fixed-scope bulk-delete objects
      description: Returns durable work. Poll the operation endpoint until a terminal status is reached.
      x-permission: files.copy
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FileOperationCreateRuntime'}}}}
      responses:
        '202': {description: Operation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/FileOperationRuntime'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/file_operations/{operation_id}:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    get:
      tags: [Files]
      operationId: get_file_operation
      summary: Read durable worker and reconciliation outcome
      responses:
        '200': {description: Operation state, content: {application/json: {schema: {$ref: '#/components/schemas/FileOperationRuntime'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/storage_spaces/{space_id}/uploads:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    post:
      tags: [Uploads]
      operationId: create_upload
      summary: Reserve quota and choose proxy or direct PUT according to capabilities
      x-permission: files.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadCreateRuntime'}}}}
      responses:
        '201': {description: Durable upload session and ingestion intent, content: {application/json: {schema: {$ref: '#/components/schemas/UploadSessionRuntime'}}}}
        '409': {$ref: '#/components/responses/QuotaExceeded'}
        '422': {$ref: '#/components/responses/InvalidObjectKey'}
  /api/v1/uploads/{upload_id}:
    parameters: [{$ref: '#/components/parameters/UploadId'}]
    get:
      tags: [Uploads]
      operationId: get_upload
      responses:
        '200': {description: Upload state without a signed URL, content: {application/json: {schema: {$ref: '#/components/schemas/UploadSessionRuntime'}}}}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/uploads/{upload_id}/content:
    parameters: [{$ref: '#/components/parameters/UploadId'}]
    put:
      tags: [Uploads]
      operationId: proxy_upload_content
      summary: Stream exact content through the service for proxy-mode uploads
      x-permission: files.write
      parameters: [{name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 0}}, {name: Content-Type, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}}
      responses:
        '204': {description: Content stored and verified}
        '409': {$ref: '#/components/responses/UploadVerificationFailed'}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/uploads/{upload_id}/completion:
    parameters: [{$ref: '#/components/parameters/UploadId'}]
    post:
      tags: [Uploads]
      operationId: complete_upload
      summary: Verify exact stored metadata before making the object available
      x-permission: files.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadCompleteRuntime'}}}}
      responses:
        '200': {description: Committed ingestion result, content: {application/json: {schema: {$ref: '#/components/schemas/IngestionCommitResult'}}}}
        '409': {$ref: '#/components/responses/UploadVerificationFailed'}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/storage_spaces/{space_id}/presigned_downloads:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    post:
      tags: [Uploads]
      operationId: create_presigned_download
      x-permission: presigned_urls.issue
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PresignedDownloadCreate'}}}}
      responses:
        '201': {description: One-time response containing an exact GET request for a controlled file reference, content: {application/json: {schema: {$ref: '#/components/schemas/PresignedDownloadRuntime'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
  /api/v1/storage_spaces/{space_id}/multipart_uploads:
    parameters: [{$ref: '#/components/parameters/SpaceId'}]
    post:
      tags: [Multipart]
      operationId: create_multipart_upload
      x-permission: multipart.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartCreateRuntime'}}}}
      responses:
        '201': {description: Bound multipart session and ingestion intent, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartUploadRuntime'}}}}
        '409': {$ref: '#/components/responses/QuotaExceeded'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
  /api/v1/multipart_uploads/{multipart_id}:
    parameters: [{$ref: '#/components/parameters/MultipartId'}]
    get:
      tags: [Multipart]
      operationId: get_multipart_upload
      responses:
        '200': {description: Multipart session, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartUploadRuntime'}}}}
        '410': {$ref: '#/components/responses/Expired'}
    delete:
      tags: [Multipart]
      operationId: abort_multipart_upload
      x-permission: multipart.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Multipart upload aborted and reservation released}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/multipart_uploads/{multipart_id}/parts:
    parameters: [{$ref: '#/components/parameters/MultipartId'}]
    get:
      tags: [Multipart]
      operationId: list_multipart_parts
      responses:
        '200': {description: Bound multipart parts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MultipartPartRuntime'}}}}}
        '410': {$ref: '#/components/responses/Expired'}
    post:
      tags: [Multipart]
      operationId: create_multipart_part
      summary: Issue an exact part PUT request
      x-permission: multipart.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartPartCreate'}}}}
      responses:
        '201': {description: Bound multipart part state, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartPartRuntime'}}}}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/multipart_uploads/{multipart_id}/parts/{part_number}:
    parameters: [{$ref: '#/components/parameters/MultipartId'}, {name: part_number, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 10000}}]
    put:
      tags: [Multipart]
      operationId: confirm_multipart_part
      summary: Record an opaque ETag after validating this bound part
      x-permission: multipart.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartPartConfirm'}}}}
      responses:
        '200': {description: Confirmed part, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartPartRuntime'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/multipart_uploads/{multipart_id}/completion:
    parameters: [{$ref: '#/components/parameters/MultipartId'}]
    post:
      tags: [Multipart]
      operationId: complete_multipart_upload
      x-permission: multipart.manage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultipartComplete'}}}}
      responses:
        '200': {description: Committed ingestion result, content: {application/json: {schema: {$ref: '#/components/schemas/IngestionCommitResult'}}}}
        '409': {$ref: '#/components/responses/MultipartInvalid'}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v1/quotas:
    get:
      tags: [Quotas]
      operationId: list_quotas
      x-permission: quotas.read
      parameters: [{name: storage_space_id, in: query, schema: {type: [string, 'null']}}]
      responses:
        '200': {description: Quota page, content: {application/json: {schema: {$ref: '#/components/schemas/QuotaPage'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /api/v1/quotas/{quota_id}:
    parameters: [{$ref: '#/components/parameters/QuotaId'}]
    get:
      tags: [Quotas]
      operationId: get_quota
      x-permission: quotas.read
      responses:
        '200': {description: Quota, content: {application/json: {schema: {$ref: '#/components/schemas/Quota'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Quotas]
      operationId: update_quota
      x-permission: quotas.manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotaUpdate'}}}}
      responses:
        '200': {description: Updated quota, content: {application/json: {schema: {$ref: '#/components/schemas/Quota'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/audit_events:
    get:
      tags: [Audit]
      operationId: list_audit_events
      summary: Search immutable tenant audit events
      x-permission: audit.read
      parameters: [{name: occurred_from, in: query, schema: {type: [string, 'null']}}, {name: occurred_to, in: query, schema: {type: [string, 'null']}}, {name: action, in: query, schema: {type: [string, 'null']}}, {name: actor_principal_id, in: query, schema: {type: [string, 'null']}}]
      responses:
        '200': {description: Audit page, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPage'}, examples: {empty: {$ref: '#/components/examples/EmptyPage'}}}}}
        '400': {$ref: '#/components/responses/InvalidCursor'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /api/v1/audit_events/{audit_event_id}:
    parameters: [{$ref: '#/components/parameters/AuditEventId'}]
    get:
      tags: [Audit]
      operationId: get_audit_event
      x-permission: audit.read
      responses:
        '200': {description: Immutable audit event, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEvent'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    session_cookie: {type: apiKey, in: cookie, name: s3mp_session, description: Secure HttpOnly browser session; unsafe requests also require CSRF protection.}
    s3mp_key: {type: apiKey, in: header, name: Authorization, description: 'S3MP-Key <key_id>.<secret>'}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 4096}, description: Opaque cursor bound to tenant, principal, authorization version and query.}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: Current opaque resource etag.}
    UserId: {name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    MembershipId: {name: membership_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    GroupId: {name: group_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RoleId: {name: role_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RoleBindingId: {name: role_binding_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    PrincipalId: {name: principal_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ApplicationId: {name: application_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ApiKeyId: {name: api_key_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ConnectionId: {name: connection_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    SpaceId: {name: space_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    FileId: {name: file_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    OperationId: {name: operation_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    UploadId: {name: upload_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    MultipartId: {name: multipart_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    QuotaId: {name: quota_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AuditEventId: {name: audit_event_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
  responses:
    AuthenticationRequired: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MembershipInactive: {description: Membership inactive, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PermissionDenied: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {denied: {$ref: '#/components/examples/PermissionDenied'}}}}}
    NotFound: {description: Not found or concealed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidCursor: {description: Cursor invalid or stale, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: State conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {conflict: {$ref: '#/components/examples/Conflict'}}}}}
    ValidationFailed: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    EtagMismatch: {description: Resource changed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    EtagRequired: {description: If-Match is required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Expired: {description: Resource expired, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {expired: {$ref: '#/components/examples/Expired'}}}}}
    QuotaExceeded: {description: Quota cannot be reserved, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidObjectKey: {description: Unsafe or ambiguous object key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    UploadVerificationFailed: {description: Actual object does not match declaration, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MultipartInvalid: {description: Multipart parts invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    UnsupportedCapability: {description: Required connection capability unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    StorageUnavailable: {description: Storage unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Id: {type: string}
    Timestamp: {type: string, format: date-time, pattern: 'Z$'}
    ObjectKey: {type: string, minLength: 1, maxLength: 1024, description: Canonical relative object key; no leading slash, dot segments, backslash, controls or ambiguous encoding.}
    CanonicalPrefix: {type: string, maxLength: 1024, description: Canonical relative prefix; empty string denotes the complete storage space.}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        message: {type: string}
        request_id: {$ref: '#/components/schemas/Id'}
        details: {type: object, additionalProperties: true}
    PageBase:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: {next_cursor: {type: [string, 'null']}}
    TenantSummary:
      type: object
      additionalProperties: false
      required: [id, name, membership_status]
      properties: {id: {$ref: '#/components/schemas/Id'}, name: {type: string}, membership_status: {$ref: '#/components/schemas/MembershipStatus'}}
    PrincipalSummary:
      type: object
      additionalProperties: false
      required: [id, type, display_name]
      properties: {id: {$ref: '#/components/schemas/Id'}, type: {type: string, enum: [user, group, application]}, display_name: {type: string}}
    Me:
      type: object
      additionalProperties: false
      required: [principal, current_tenant, available_tenants, coarse_permissions, authorization_version]
      properties:
        principal: {$ref: '#/components/schemas/PrincipalSummary'}
        current_tenant: {$ref: '#/components/schemas/TenantSummary'}
        available_tenants: {type: array, items: {$ref: '#/components/schemas/TenantSummary'}}
        coarse_permissions: {type: array, uniqueItems: true, items: {type: string}}
        authorization_version: {type: integer, minimum: 1}
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, created_at]
      properties: {id: {$ref: '#/components/schemas/Id'}, email: {type: string, format: email}, display_name: {type: string}, status: {type: string, enum: [active, disabled]}, created_at: {$ref: '#/components/schemas/Timestamp'}}
    UserPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}}]}
    MembershipStatus: {type: string, enum: [invited, active, suspended, removed]}
    Membership:
      type: object
      additionalProperties: false
      required: [id, user, principal, status, authorization_version, created_at, updated_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, user: {$ref: '#/components/schemas/User'}, principal: {$ref: '#/components/schemas/PrincipalSummary'}, status: {$ref: '#/components/schemas/MembershipStatus'}, authorization_version: {type: integer, minimum: 1}, created_at: {$ref: '#/components/schemas/Timestamp'}, updated_at: {$ref: '#/components/schemas/Timestamp'}, etag: {type: string}}
    MembershipCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, minLength: 3, maxLength: 320}, display_name: {type: [string, 'null'], maxLength: 200}}
    MembershipUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties: {status: {type: string}, reason: {type: string, minLength: 1, maxLength: 500}}
    MembershipPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Membership'}}}}]}
    Group:
      type: object
      additionalProperties: false
      required: [id, principal, name, description, member_count, created_at, updated_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, principal: {$ref: '#/components/schemas/PrincipalSummary'}, name: {type: string}, description: {type: string}, member_count: {type: integer, minimum: 0}, created_at: {$ref: '#/components/schemas/Timestamp'}, updated_at: {$ref: '#/components/schemas/Timestamp'}, etag: {type: string}}
    GroupWrite: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}, description: {type: [string, 'null'], maxLength: 1000}}}
    GroupPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Group'}}}}]}
    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, permissions, system, created_at, updated_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, name: {type: string}, description: {type: string}, permissions: {type: array, uniqueItems: true, items: {type: string}}, system: {type: boolean}, created_at: {$ref: '#/components/schemas/Timestamp'}, updated_at: {$ref: '#/components/schemas/Timestamp'}, etag: {type: string}}
    RoleWrite: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}, description: {type: [string, 'null'], maxLength: 1000}, permissions: {type: array, items: {type: string}}}}
    RolePage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Role'}}}}]}
    ResourceScope:
      type: object
      additionalProperties: false
      required: [type]
      properties: {type: {type: string, enum: [tenant, storage_space, directory]}, storage_space_id: {type: [string, 'null']}, canonical_prefix: {type: [string, 'null']}}
    RoleBinding:
      type: object
      additionalProperties: false
      required: [id, principal, role_id, effect, scope, reason, starts_at, expires_at, created_by, created_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, principal: {$ref: '#/components/schemas/PrincipalSummary'}, role_id: {$ref: '#/components/schemas/Id'}, effect: {type: string, enum: [allow, deny]}, scope: {$ref: '#/components/schemas/ResourceScope'}, reason: {type: string}, starts_at: {$ref: '#/components/schemas/Timestamp'}, expires_at: {$ref: '#/components/schemas/Timestamp'}, created_by: {$ref: '#/components/schemas/Id'}, created_at: {$ref: '#/components/schemas/Timestamp'}, etag: {type: string}}
    RoleBindingCreate:
      type: object
      additionalProperties: false
      required: [principal_id, role_id, effect, scope, reason, expires_at]
      properties: {principal_id: {$ref: '#/components/schemas/Id'}, role_id: {$ref: '#/components/schemas/Id'}, effect: {type: string, enum: [allow, deny]}, scope: {$ref: '#/components/schemas/ResourceScope'}, reason: {type: string, minLength: 1, maxLength: 500}, starts_at: {$ref: '#/components/schemas/Timestamp'}, expires_at: {$ref: '#/components/schemas/Timestamp'}}
    RoleBindingPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/RoleBinding'}}}}]}
    DecisionSource:
