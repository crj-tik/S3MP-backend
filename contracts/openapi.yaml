openapi: 3.1.0
info:
  title: S3MP API
  version: 1.1.0
  description: S3MP 是面向多租户的受控文件存储服务。管理接口使用租户会话 Cookie `s3mp_session`；账户登录与平台控制接口使用账户会话 Cookie `s3mp_account_session`。浏览器发起变更请求时同时提交
    `X-S3MP-CSRF`，服务端应用访问使用 API Key。错误响应统一返回稳定的 `code`、可读的 `message` 和用于排障的 `request_id`；任何会话值、API Key
    或存储凭据均不会出现在响应中。
paths:
  /health/live:
    get:
      tags:
      - health
      summary: 检查 API 进程是否存活
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Health Live Get
        '400': &id001
          description: 请求未成功；响应遵循统一错误信封。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '500': *id001
      description: 检查 API 进程是否存活；不检查数据库、Redis 或对象存储。
  /health/ready:
    get:
      tags:
      - health
      summary: 检查 API 是否已就绪，并验证已启用的外部依赖。
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '500': *id001
      description: 检查 API 是否已就绪，并验证已启用的外部依赖。
  /api/v1/me:
    get:
      tags:
      - Context
      summary: 获取当前已选租户中的身份、成员关系与有效权限上下文。
      operationId: get_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '500': *id001
      description: 获取当前已选租户中的身份、成员关系与有效权限上下文。
  /api/v1/users:
    get:
      tags:
      - Context
      summary: 列出当前租户可见的用户账户。
      operationId: list_users
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 列出当前租户可见的用户账户。
      x-permission: members.read
  /api/v1/users/{user_id}:
    get:
      tags:
      - Context
      summary: 获取当前租户中指定用户的公开身份信息。
      operationId: get_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
        description: 全局用户账户的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 获取当前租户中指定用户的公开身份信息。
      x-permission: members.read
  /api/v1/members:
    get:
      tags:
      - Context
      summary: 列出当前租户的成员关系。
      operationId: list_members
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 列出当前租户的成员关系。
      x-permission: members.read
    post:
      tags:
      - Context
      summary: 将已有用户加入当前租户，或创建受邀成员关系。
      operationId: create_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 将已有用户加入当前租户，或创建受邀成员关系。
      x-permission: members.manage
  /api/v1/members/{membership_id}:
    get:
      tags:
      - Context
      summary: 获取当前租户中指定成员关系的详情。
      operationId: get_member
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 获取当前租户中指定成员关系的详情。
      x-permission: members.read
    patch:
      tags:
      - Context
      summary: 更新成员状态
      operationId: update_member
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
        description: 客户端已读取的资源 ETag；用于拒绝覆盖较新的服务端状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 更新成员状态；暂停、移除或到期会立即回收租户权限。
      x-permission: members.manage
  /api/v1/groups/{group_id}/members:
    get:
      tags:
      - Context
      summary: 列出指定用户组中的成员关系。
      operationId: list_group_members
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 列出指定用户组中的成员关系。
      x-permission: groups.read
    post:
      tags:
      - Context
      summary: 将当前租户成员加入指定用户组。
      operationId: add_group_member
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupMemberBody'
      responses:
        '204':
          description: Successful Response
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 将当前租户成员加入指定用户组。
      x-permission: groups.manage
  /api/v1/groups/{group_id}/members/{membership_id}:
    delete:
      tags:
      - Context
      summary: 将成员从指定用户组移除。
      operationId: remove_group_member
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      responses:
        '204':
          description: Successful Response
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 将成员从指定用户组移除。
      x-permission: groups.manage
  /api/v1/auth/login:
    post:
      tags:
      - Account authentication
      summary: 校验邮箱或公司系统号及密码并建立账户会话
      operationId: account_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContext'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 校验邮箱或公司系统号及密码并建立账户会话；响应设置账户会话 Cookie 和可读的账户 CSRF Cookie，并返回当前账户真实的 platform_permissions；但不会自动选择租户。
  /api/v1/auth/me:
    get:
      tags:
      - Account authentication
      summary: 获取当前账户及其可选择的活跃租户摘要。
      operationId: get_account_context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContext'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '500': *id001
      description: 获取当前账户及其可选择的活跃租户摘要。
  /api/v1/auth/logout:
    post:
      tags:
      - Account authentication
      summary: 撤销当前账户会话并清除账户 Cookie
      operationId: account_logout
      parameters:
      - name: X-S3MP-CSRF
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-S3Mp-Csrf
        description: 浏览器会话的 CSRF 校验值；账户操作取自 s3mp_account_csrf Cookie，租户操作取自 s3mp_csrf Cookie，并原样放入此请求头。
      responses:
        '204':
          description: Successful Response
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 撤销当前账户会话并清除账户 Cookie；客户端必须把 s3mp_account_csrf Cookie 的值原样放入 X-S3MP-CSRF 请求头。
  /api/v1/auth/tenant-sessions:
    post:
      tags:
      - Account authentication
      summary: 为账户选择一个活跃租户成员关系，并建立独立的租户会话
      operationId: select_tenant_session
      parameters:
      - name: X-S3MP-CSRF
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-S3Mp-Csrf
        description: 浏览器会话的 CSRF 校验值；账户操作取自 s3mp_account_csrf Cookie，租户操作取自 s3mp_csrf Cookie，并原样放入此请求头。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSessionRequest'
      responses:
        '204':
          description: Successful Response
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 为账户选择一个活跃租户成员关系，并建立独立的租户会话；客户端必须把 s3mp_account_csrf Cookie 的值原样放入 X-S3MP-CSRF 请求头。
  /api/v1/account/register:
    post:
      tags:
      - Platform account
      summary: 注册全局平台账户
      operationId: register_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Register Account
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 注册全局平台账户；仅创建账户身份，不创建租户成员关系或平台角色；该公开接口不要求已有会话或 X-S3MP-CSRF 请求头。
  /api/v1/platform/tenants:
    get:
      tags:
      - Platform tenants
      summary: 列出平台可管理的租户生命周期摘要
      operationId: list_platform_tenants
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
        description: 本页最多返回的记录数。
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
        description: “include_deleted”字段；具体取值和约束见当前资源说明。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantPage'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 列出平台可管理的租户生命周期摘要；不返回租户数据面内容。
    post:
      tags:
      - Platform tenants
      summary: 创建租户，并在同一事务中建立指定初始管理员的成员关系和管理员授权。
      operationId: create_platform_tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 创建租户，并在同一事务中建立指定初始管理员的成员关系和管理员授权。
  /api/v1/platform/tenants/{tenant_id}:
    get:
      tags:
      - Platform tenants
      summary: 获取平台视角下的租户生命周期摘要。
      operationId: get_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 获取平台视角下的租户生命周期摘要。
    patch:
      tags:
      - Platform tenants
      summary: 更新租户名称或生命周期状态。
      operationId: update_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 更新租户名称或生命周期状态。
    delete:
      tags:
      - Platform tenants
      summary: 执行该公开 API 操作
      operationId: delete_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantLifecycleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 执行该公开 API 操作；具体输入、输出和授权要求见下方说明。
  /api/v1/platform/tenants/{tenant_id}/restore:
    post:
      tags:
      - Platform tenants
      summary: 执行该公开 API 操作
      operationId: restore_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantLifecycleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantResponse'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '500': *id001
      description: 执行该公开 API 操作；具体输入、输出和授权要求见下方说明。
  /api/v1/platform/accounts:
    get:
      tags:
      - Platform control plane
      summary: 分页列出平台账户目录，可按邮箱、系统号、姓名和账户状态筛选。
      operationId: list_platform_accounts
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
        description: 本页最多返回的记录数。
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 320
          - type: 'null'
          title: Query
        description: “query”字段；具体取值和约束见当前资源说明。
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - disabled
            type: string
          - type: 'null'
          title: Status
        description: 资源当前生命周期状态。
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
        description: “include_deleted”字段；具体取值和约束见当前资源说明。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '422': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
