      properties: {permission: {type: string}, decision: {type: string, enum: [allow, deny]}, reason_code: {type: string}, sources: {type: array, items: {$ref: '#/components/schemas/DecisionSource'}}}
    EffectivePermissions: {type: object, additionalProperties: false, required: [principal_id, authorization_version, evaluated_at, permissions], properties: {principal_id: {$ref: '#/components/schemas/Id'}, authorization_version: {type: integer}, evaluated_at: {$ref: '#/components/schemas/Timestamp'}, permissions: {type: array, items: {$ref: '#/components/schemas/EffectivePermission'}}}}
    AuthorizationSimulationRequest: {type: object, additionalProperties: false, required: [principal_id, permission], properties: {principal_id: {type: string}, permission: {type: string}, storage_space_id: {type: [string, 'null']}, object_key: {type: [string, 'null']}}}
    AuthorizationDecision: {type: object, additionalProperties: false, required: [permission, decision, reason_code, authorization_version, evaluated_at, sources], properties: {permission: {type: string}, decision: {type: string, enum: [allow, deny]}, reason_code: {type: string}, authorization_version: {type: integer}, evaluated_at: {$ref: '#/components/schemas/Timestamp'}, sources: {type: array, items: {$ref: '#/components/schemas/DecisionSource'}}}}
    OwnerRef: {type: object, additionalProperties: false, required: [principal_id, principal_type], properties: {principal_id: {$ref: '#/components/schemas/Id'}, principal_type: {type: string, enum: [user, group]}}}
    Application:
      type: object
      additionalProperties: false
      required: [id, name, status, owners, takeover_required, created_at, updated_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, name: {type: string}, status: {type: string, enum: [active, disabled, pending_takeover]}, owners: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OwnerRef'}}, takeover_required: {type: boolean}, created_at: {$ref: '#/components/schemas/Timestamp'}, updated_at: {$ref: '#/components/schemas/Timestamp'}, etag: {type: string}}
    ApplicationCreate: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}}}
    ApplicationUpdate: {type: object, additionalProperties: false, properties: {name: {type: [string, 'null'], maxLength: 200}}}
    ApplicationTakeover: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}
    ApplicationPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Application'}}}}]}
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, application_id, name, prefix, scopes, status, created_at, expires_at, last_used_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, application_id: {$ref: '#/components/schemas/Id'}, name: {type: string}, prefix: {type: string}, scopes: {type: array, uniqueItems: true, items: {type: string}}, status: {type: string, enum: [active, disabled, revoked, expired, rotating]}, created_at: {$ref: '#/components/schemas/Timestamp'}, expires_at: {$ref: '#/components/schemas/Timestamp'}, last_used_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: "null"}]}, etag: {type: string}}
    ApiKeyCreate: {type: object, additionalProperties: false, properties: {scopes: {type: array, items: {type: string}}, ttl_days: {type: integer, minimum: 1, maximum: 365, default: 90}}}
    IssuedApiKey: {type: object, additionalProperties: false, required: [api_key, credential], properties: {api_key: {$ref: '#/components/schemas/ApiKey'}, credential: {type: string, writeOnly: true, description: One-time `key_id.secret`; never retrievable again.}}}
    ApiKeyPage: {allOf: [{$ref: '#/components/schemas/PageBase'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}}}]}
    ApiKeyRevocation: {type: object, additionalProperties: false, required: [api_key, revoked_at, presigned_exposure_until], properties: {api_key: {$ref: '#/components/schemas/ApiKey'}, revoked_at: {$ref: '#/components/schemas/Timestamp'}, presigned_exposure_until: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: "null"}]}}}
    StorageCapabilities: {type: object, additionalProperties: false, required: [list, head, proxy_upload, presigned_get, presigned_put, multipart, copy, delete], properties: {list: {type: boolean}, head: {type: boolean}, proxy_upload: {type: boolean}, presigned_get: {type: boolean}, presigned_put: {type: boolean}, multipart: {type: boolean}, copy: {type: boolean}, delete: {type: boolean}, max_presign_ttl_seconds: {type: integer, minimum: 1}}}
    StorageConnection:
      type: object
      additionalProperties: false
      required: [id, name, endpoint, region, signature_version, path_style, credential_reference, status, capabilities, last_probed_at, etag]
      properties: {id: {$ref: '#/components/schemas/Id'}, name: {type: string}, endpoint: {type: string, format: uri}, region: {type: string}, signature_version: {type: string, const: sigv4}, path_style: {type: boolean}, credential_reference: {type: string, description: Redacted external secret reference, pattern: '^secret://'}, status: {type: string, enum: [pending, available, unavailable]}, capabilities: {$ref: '#/components/schemas/StorageCapabilities'}, last_probed_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: "null"}]}, etag: {type: string}}
    StorageConnectionCreate: {type: object, additionalProperties: false, required: [name, endpoint, region, credential_reference], properties: {name: {type: string, minLength: 1, maxLength: 200}, endpoint: {type: string, minLength: 1, maxLength: 500}, region: {type: string, minLength: 1, maxLength: 100}, path_style: {type: boolean, default: true}, credential_reference: {type: string, minLength: 1, maxLength: 500}}}
