    MetadataQuotaScope:
      type: string
      title: MetadataQuotaScope
      enum:
      - tenant
      - application
      description: 由 /api/v1/metadata/catalog 同步发布的稳定枚举值。
    MetadataStorageAddressing:
      type: string
      title: MetadataStorageAddressing
      enum:
      - path
      - virtual
      description: 由 /api/v1/metadata/catalog 同步发布的稳定枚举值。
    SharedStorageProfile:
      type: object
      title: SharedStorageProfile
      description: 平台唯一共享 S3 目标的脱敏运行摘要；物理连接参数仅由部署配置维护。
      required:
      - bucket
      - region
      - path_style
      - signature_version
      - profile_version
      properties:
        bucket:
          type: string
          description: 所有租户与应用共同使用的服务端 Bucket。
        region:
          type: string
          description: 共享 S3 目标使用的区域标识。
        path_style:
          type: boolean
          description: 是否按 path-style 生成 S3 请求；生产和 MinIO 均可由部署配置启用。
        signature_version:
          type: string
          enum:
          - s3v4
          description: S3 请求签名协议版本。
        profile_version:
          type: integer
          minimum: 1
          description: 共享目标配置版本；排队任务据此拒绝陈旧目标。
    ApplicationStorageNamespace:
      type: object
      title: ApplicationStorageNamespace
      description: 由服务端固定的应用存储命名空间；调用方只能提供相对对象路径，不能提供物理 Key。
      required:
      - application_id
      - storage_space_id
      - storage_namespace
      - profile_version
      properties:
        application_id:
          type: string
          format: uuid
          description: 命名空间所属应用标识。
        storage_space_id:
          type: string
          format: uuid
          description: 该应用唯一逻辑存储空间标识。
        storage_namespace:
          type: string
          description: 不可变的服务端对象 Key 前缀。
        profile_version:
          type: integer
          minimum: 1
          description: 创建该命名空间时的共享 profile 版本。
    ApplicationPathGrant:
      type: object
      title: ApplicationPathGrant
      description: 角色绑定中的应用文件路径授权范围；用户组只能通过活跃成员关系取得该授权，不能登录。
      required:
      - type
      - storage_space_id
      properties:
        type:
          type: string
          enum:
          - storage_space
          - directory
          description: storage_space 覆盖应用全部路径；directory 仅覆盖 canonical_prefix。
        storage_space_id:
          type: string
          format: uuid
          description: 已绑定应用的逻辑存储空间标识。
        canonical_prefix:
          type: string
          description: directory 范围使用的规范相对前缀；storage_space 范围不需要该字段。
    QuotaStatus:
      type: object
      title: QuotaStatus
      description: 租户或应用配额状态；可用容量为上限减去已用量与上传保留量。
      required:
      - scope_type
      - used_bytes
      - reserved_bytes
      - available_bytes
      properties:
        scope_type:
          type: string
          enum:
          - tenant
          - application
          description: 配额统计范围。
        limit_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 允许使用和预留的容量上限。
        used_bytes:
          type: integer
          minimum: 0
          description: 已被对象存储验证并提交的容量。
        reserved_bytes:
          type: integer
          minimum: 0
          description: 进行中上传暂时保留的容量。
        available_bytes:
          type: integer
          minimum: 0
          description: 当前还能预留的容量。
        measured_at:
          type: string
          format: date-time
          description: 本次用量读取或校准时间。
    QuotaReconciliationItem:
      type: object
      title: QuotaReconciliationItem
      description: 一次配额校准中某个租户或应用范围的结果；不包含对象内容或凭据。
      required:
      - scope_type
      - status
      properties:
        scope_type:
          type: string
          enum:
          - tenant
          - application
          description: 被校准的配额范围。
        status:
          type: string
          enum:
          - unchanged
          - corrected
          - quarantined
          - failed
          description: 该范围的校准结论。
        actual_used_bytes:
          type: integer
          minimum: 0
          description: 按已验证对象统计的实际已用容量。
        reason_code:
          type: string
          description: 冲突、隔离或失败时供程序处理的稳定原因代码。
    QuotaReconciliationResult:
      type: object
      title: QuotaReconciliationResult
      description: 配额校准任务汇总；用于运维任务输出，不代表对外文件内容接口。
      required:
      - started_at
      - completed_at
      - items
      properties:
        started_at:
          type: string
          format: date-time
          description: 校准任务开始时间。
        completed_at:
          type: string
          format: date-time
          description: 校准任务结束时间。
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuotaReconciliationItem'
          description: 逐范围的校准结果。
