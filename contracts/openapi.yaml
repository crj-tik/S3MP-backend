openapi: 3.1.0
info:
  title: S3MP API
  version: 1.1.0
  description: S3MP 是面向多租户的受控文件存储服务。管理接口使用租户会话 Cookie `s3mp_session`；账户登录与平台控制接口使用账户会话 Cookie `s3mp_account_session`。浏览器发起变更请求时同时提交
    `X-S3MP-CSRF`，服务端应用访问使用 API Key。错误响应统一返回稳定的 `code`、可读的 `message` 和用于排障的 `request_id`；任何会话值、API Key
    或存储凭据均不会出现在响应中。
paths:
  /health/live:
    get:
      tags:
      - health
      summary: 检查 API 进程是否存活
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Health Live Get
      description: 检查 API 进程是否存活；不检查数据库、Redis 或对象存储。
  /health/ready:
    get:
      tags:
      - health
      summary: 检查 API 是否已就绪，并验证已启用的外部依赖。
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      description: 检查 API 是否已就绪，并验证已启用的外部依赖。
  /api/v1/me:
    get:
      tags:
      - Context
      summary: 获取当前已选租户中的身份、成员关系与有效权限上下文。
      operationId: get_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      description: 获取当前已选租户中的身份、成员关系与有效权限上下文。
  /api/v1/users:
    get:
      tags:
      - Context
      summary: 列出当前租户可见的用户账户。
      operationId: list_users
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 列出当前租户可见的用户账户。
      x-permission: members.read
  /api/v1/users/{user_id}:
    get:
      tags:
      - Context
      summary: 获取当前租户中指定用户的公开身份信息。
      operationId: get_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
        description: 全局用户账户的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 获取当前租户中指定用户的公开身份信息。
      x-permission: members.read
  /api/v1/members:
    get:
      tags:
      - Context
      summary: 列出当前租户的成员关系。
      operationId: list_members
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 列出当前租户的成员关系。
      x-permission: members.read
    post:
      tags:
      - Context
      summary: 将已有用户加入当前租户，或创建受邀成员关系。
      operationId: create_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 将已有用户加入当前租户，或创建受邀成员关系。
      x-permission: members.manage
  /api/v1/members/{membership_id}:
    get:
      tags:
      - Context
      summary: 获取当前租户中指定成员关系的详情。
      operationId: get_member
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 获取当前租户中指定成员关系的详情。
      x-permission: members.read
    patch:
      tags:
      - Context
      summary: 更新成员状态
      operationId: update_member
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
        description: 客户端已读取的资源 ETag；用于拒绝覆盖较新的服务端状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 更新成员状态；暂停、移除或到期会立即回收租户权限。
      x-permission: members.manage
  /api/v1/groups/{group_id}/members:
    get:
      tags:
      - Context
      summary: 列出指定用户组中的成员关系。
      operationId: list_group_members
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 列出指定用户组中的成员关系。
      x-permission: groups.read
    post:
      tags:
      - Context
      summary: 将当前租户成员加入指定用户组。
      operationId: add_group_member
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupMemberBody'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 将当前租户成员加入指定用户组。
      x-permission: groups.manage
  /api/v1/groups/{group_id}/members/{membership_id}:
    delete:
      tags:
      - Context
      summary: 将成员从指定用户组移除。
      operationId: remove_group_member
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Membership Id
        description: 租户成员关系的服务端唯一标识。
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 将成员从指定用户组移除。
      x-permission: groups.manage
  /api/v1/auth/login:
    post:
      tags:
      - Account authentication
      summary: 校验邮箱或公司系统号及密码并建立账户会话
      operationId: account_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Account Login
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 校验邮箱或公司系统号及密码并建立账户会话；响应设置账户会话 Cookie 和可读的账户 CSRF Cookie，但不会自动选择租户。
  /api/v1/auth/me:
    get:
      tags:
      - Account authentication
      summary: 获取当前账户及其可选择的活跃租户摘要。
      operationId: get_account_context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Account Context
      description: 获取当前账户及其可选择的活跃租户摘要。
  /api/v1/auth/logout:
    post:
      tags:
      - Account authentication
      summary: 撤销当前账户会话并清除账户 Cookie
      operationId: account_logout
      parameters:
      - name: X-S3MP-CSRF
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-S3Mp-Csrf
        description: 浏览器会话的 CSRF 校验值；账户操作取自 s3mp_account_csrf Cookie，租户操作取自 s3mp_csrf Cookie，并原样放入此请求头。
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 撤销当前账户会话并清除账户 Cookie；客户端必须把 s3mp_account_csrf Cookie 的值原样放入 X-S3MP-CSRF 请求头。
  /api/v1/auth/tenant-sessions:
    post:
      tags:
      - Account authentication
      summary: 为账户选择一个活跃租户成员关系，并建立独立的租户会话
      operationId: select_tenant_session
      parameters:
      - name: X-S3MP-CSRF
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-S3Mp-Csrf
        description: 浏览器会话的 CSRF 校验值；账户操作取自 s3mp_account_csrf Cookie，租户操作取自 s3mp_csrf Cookie，并原样放入此请求头。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSessionRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 为账户选择一个活跃租户成员关系，并建立独立的租户会话；客户端必须把 s3mp_account_csrf Cookie 的值原样放入 X-S3MP-CSRF 请求头。
  /api/v1/account/register:
    post:
      tags:
      - Platform account
      summary: 注册全局平台账户
      operationId: register_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Register Account
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 注册全局平台账户；仅创建账户身份，不创建租户成员关系或平台角色。
  /api/v1/platform/tenants:
    get:
      tags:
      - Platform tenants
      summary: 列出平台可管理的租户生命周期摘要
      operationId: list_platform_tenants
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Platform Tenants
      description: 列出平台可管理的租户生命周期摘要；不返回租户数据面内容。
    post:
      tags:
      - Platform tenants
      summary: 创建租户，并在同一事务中建立指定初始管理员的成员关系和管理员授权。
      operationId: create_platform_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Create Platform Tenant
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 创建租户，并在同一事务中建立指定初始管理员的成员关系和管理员授权。
  /api/v1/platform/tenants/{tenant_id}:
    get:
      tags:
      - Platform tenants
      summary: 获取平台视角下的租户生命周期摘要。
      operationId: get_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Platform Tenant
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 获取平台视角下的租户生命周期摘要。
    patch:
      tags:
      - Platform tenants
      summary: 更新租户名称或生命周期状态。
      operationId: update_platform_tenant
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tenant Id
        description: 租户的服务端唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Update Platform Tenant
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 更新租户名称或生命周期状态。
  /api/v1/platform/role-bindings:
    post:
      tags:
      - Platform roles
      summary: 向全局账户授予限期或长期的平台角色
      operationId: grant_platform_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRoleGrant'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Grant Platform Role
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 向全局账户授予限期或长期的平台角色；不会授予任何租户数据面权限。
  /api/v1/platform/role-bindings/{binding_id}:
    delete:
      tags:
      - Platform roles
      summary: 撤销指定的平台角色绑定。
      operationId: revoke_platform_role
      parameters:
      - name: binding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Binding Id
        description: 平台角色绑定的服务端唯一标识。
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 撤销指定的平台角色绑定。
  /api/v1/platform/support-access:
    post:
      tags:
      - Platform support
      summary: 提交针对指定租户的限时支持访问申请
      operationId: request_support_access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportAccessCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Request Support Access
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 提交针对指定租户的限时支持访问申请；默认不包含文件内容权限。
  /api/v1/platform/support-access/{request_id}/approvals:
    post:
      tags:
      - Platform support
      summary: 由不同的平台人员批准支持访问申请，并物化限时租户授权。
      operationId: approve_support_access
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Request Id
        description: 请求的服务端唯一标识，用于问题追踪。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Approve Support Access
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 由不同的平台人员批准支持访问申请，并物化限时租户授权。
  /api/v1/platform/support-access/{request_id}:
    delete:
      tags:
      - Platform support
      summary: 撤销已申请或已批准的支持访问，并回收其有效租户会话。
      operationId: revoke_support_access
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Request Id
        description: 请求的服务端唯一标识，用于问题追踪。
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 撤销已申请或已批准的支持访问，并回收其有效租户会话。
  /api/v1/groups:
    get:
      tags:
      - Authorization
      summary: 列出当前租户的用户组。
      operationId: list_groups
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: 不透明分页游标；仅可用于相同查询条件的下一页请求。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 列出当前租户的用户组。
      x-permission: groups.read
    post:
      tags:
      - Authorization
      summary: 创建当前租户的用户组。
      operationId: create_group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWrite'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 创建当前租户的用户组。
      x-permission: groups.manage
  /api/v1/groups/{group_id}:
    get:
      tags:
      - Authorization
      summary: 获取指定用户组详情。
      operationId: get_group
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 获取指定用户组详情。
      x-permission: groups.read
    patch:
      tags:
      - Authorization
      summary: 更新指定用户组的名称或描述。
      operationId: update_group
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
        description: 用户组的服务端唯一标识。
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
        description: 客户端已读取的资源 ETag；用于拒绝覆盖较新的服务端状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
