- id: table/hive.olap_comm_deal_margin_fin_shop_indicator_di
  type: table
  title: 核心场景-门店分边佣金统计表
  business_domain:
  - 贝壳城市
  business_line:
  - 二手
  - 新房
  - 租赁
  description: |-
    【表名】：核心场景-门店分边佣金统计表
    【表粒度】：shop_code+statistical_code
    【用途】：人力绩效参考、保底费、拓店等 都需要到店佣金（和积分逻辑一样的佣金金额），后续陆续作为全业务场景计算门店佣金的口径。
    指标口径
