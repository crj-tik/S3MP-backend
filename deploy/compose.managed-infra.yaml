# Optional self-managed topology. Use this only when a separate PostgreSQL and
# Redis instance is required (for example, a future isolated deployment).
x-s3mp-runtime-environment: &s3mp-runtime-environment
  S3MP_ENVIRONMENT: development
  S3MP_DATABASE_URL: ${S3MP_MANAGED_DATABASE_URL:?set S3MP_MANAGED_DATABASE_URL in deploy/.env}
  S3MP_REDIS_URL: ${S3MP_MANAGED_REDIS_URL:-redis://redis:6379/0}
  S3MP_S3_ENDPOINT: ${S3MP_DOCKER_S3_ENDPOINT:-http://host.docker.internal:9000}
  S3MP_S3_REGION: ${S3MP_S3_REGION:-us-east-1}
  S3MP_S3_PATH_STYLE: ${S3MP_S3_PATH_STYLE:-true}
  S3MP_S3_BUCKET: ${S3MP_S3_BUCKET:-s3mp-dev}
  S3MP_S3_ACCESS_KEY: ${S3MP_S3_ACCESS_KEY:?set S3MP_S3_ACCESS_KEY in deploy/.env}
  S3MP_S3_SECRET_KEY: ${S3MP_S3_SECRET_KEY:?set S3MP_S3_SECRET_KEY in deploy/.env}
  S3MP_API_KEY_PEPPER: ${S3MP_API_KEY_PEPPER:?set S3MP_API_KEY_PEPPER in deploy/.env}
  S3MP_API_KEY_PEPPER_VERSION: ${S3MP_API_KEY_PEPPER_VERSION:-1}

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *s3mp-runtime-environment
      S3MP_LOG_LEVEL: INFO
      S3MP_READINESS_TIMEOUT_SECONDS: "2"
    ports: ["19101:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "s3mp.files.worker"]
    environment:
      <<: *s3mp-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: s3mp
      POSTGRES_USER: s3mp
      POSTGRES_PASSWORD: ${S3MP_MANAGED_POSTGRES_PASSWORD:?set S3MP_MANAGED_POSTGRES_PASSWORD in deploy/.env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3mp -d s3mp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
