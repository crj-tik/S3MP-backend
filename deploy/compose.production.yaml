name: s3mp

x-runtime-environment: &runtime-environment
  S3MP_ENVIRONMENT: production
  S3MP_LOG_LEVEL: ${S3MP_LOG_LEVEL:-INFO}
  S3MP_LOG_FORMAT: ${S3MP_LOG_FORMAT:-json}
  S3MP_LOG_SLOW_OPERATION_MS: ${S3MP_LOG_SLOW_OPERATION_MS:-500}
  S3MP_DATABASE_URL: ${S3MP_DATABASE_URL:?set S3MP_DATABASE_URL}
  S3MP_REDIS_URL: ${S3MP_REDIS_URL:?set S3MP_REDIS_URL}
  S3MP_RABBITMQ_URL: ${S3MP_RABBITMQ_URL:?set S3MP_RABBITMQ_URL}
  S3MP_S3_ENDPOINT: ${S3MP_S3_ENDPOINT:?set S3MP_S3_ENDPOINT}
  S3MP_S3_REGION: ${S3MP_S3_REGION:-us-east-1}
  S3MP_S3_PATH_STYLE: ${S3MP_S3_PATH_STYLE:-false}
  S3MP_S3_BUCKET: ${S3MP_S3_BUCKET:?set S3MP_S3_BUCKET}
  S3MP_S3_BUCKET_CAPACITY_GIB: ${S3MP_S3_BUCKET_CAPACITY_GIB:?set S3MP_S3_BUCKET_CAPACITY_GIB}
  S3MP_S3_ACCESS_KEY: ${S3MP_S3_ACCESS_KEY:?set S3MP_S3_ACCESS_KEY}
  S3MP_S3_SECRET_KEY: ${S3MP_S3_SECRET_KEY:?set S3MP_S3_SECRET_KEY}
  S3MP_API_KEY_PEPPER: ${S3MP_API_KEY_PEPPER:?set S3MP_API_KEY_PEPPER}
  S3MP_API_KEY_PEPPER_VERSION: ${S3MP_API_KEY_PEPPER_VERSION:-1}
  S3MP_KNOWLEDGE_EXTRACTION_ENABLED: ${S3MP_KNOWLEDGE_EXTRACTION_ENABLED:-true}
  S3MP_KNOWLEDGE_LLM_PROVIDER: ${S3MP_KNOWLEDGE_LLM_PROVIDER:?set S3MP_KNOWLEDGE_LLM_PROVIDER}
  S3MP_KNOWLEDGE_LLM_MODEL: ${S3MP_KNOWLEDGE_LLM_MODEL:?set S3MP_KNOWLEDGE_LLM_MODEL}
  S3MP_KNOWLEDGE_LLM_BASE_URL: ${S3MP_KNOWLEDGE_LLM_BASE_URL:?set S3MP_KNOWLEDGE_LLM_BASE_URL}
  S3MP_KNOWLEDGE_LLM_API_KEY: ${S3MP_KNOWLEDGE_LLM_API_KEY:?set S3MP_KNOWLEDGE_LLM_API_KEY}
  S3MP_ELASTICSEARCH_URL: ${S3MP_ELASTICSEARCH_URL:?set S3MP_ELASTICSEARCH_URL}
  S3MP_ELASTICSEARCH_API_KEY: ${S3MP_ELASTICSEARCH_API_KEY:-}
  S3MP_KNOWLEDGE_ELASTICSEARCH_INDEX: ${S3MP_KNOWLEDGE_ELASTICSEARCH_INDEX:-s3mp-knowledge-cards-v1}
  S3MP_BROWSER_COOKIE_SECURE: "true"
  S3MP_READINESS_TIMEOUT_SECONDS: "10"
  S3MP_CAS_ENABLED: ${S3MP_CAS_ENABLED:-false}
  S3MP_CAS_LOGIN_URL: ${S3MP_CAS_LOGIN_URL:-}
  S3MP_CAS_VALIDATE_URL: ${S3MP_CAS_VALIDATE_URL:-}
  S3MP_CAS_SERVICE_URL: ${S3MP_CAS_SERVICE_URL:-}
  S3MP_CAS_ISSUER: ${S3MP_CAS_ISSUER:-}
  S3MP_CAS_SESSION_HOST: ${S3MP_CAS_SESSION_HOST:-}
  S3MP_CAS_SESSION_SOURCE: ${S3MP_CAS_SESSION_SOURCE:-}
  S3MP_CAS_SESSION_SIGNATURE: ${S3MP_CAS_SESSION_SIGNATURE:-}
  S3MP_CAS_LOGOUT_URL: ${S3MP_CAS_LOGOUT_URL:-}
  S3MP_CAS_LOGOUT_RETURN_URL: ${S3MP_CAS_LOGOUT_RETURN_URL:-}
  S3MP_CAS_LOGOUT_RETURN_PARAMETER: ${S3MP_CAS_LOGOUT_RETURN_PARAMETER:-service}
  S3MP_CAS_LOG_IDENTITY_DETAILS: ${S3MP_CAS_LOG_IDENTITY_DETAILS:-false}
  S3MP_CAS_LOG_RESPONSE_BODIES: ${S3MP_CAS_LOG_RESPONSE_BODIES:-false}

services:
  migrate:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.production
      additional_contexts:
        frontend: ../../S3MP-frontend
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-S3MP 管理平台}
        VITE_API_MODE: real
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CAS_ENABLED: ${S3MP_CAS_ENABLED:-false}
    environment: *runtime-environment
    ports:
      - "${S3MP_HTTP_PORT:-31701}:80"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s

  worker:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.files.worker"]
    environment:
      <<: *runtime-environment
      S3MP_WORKER_POLL_SECONDS: "5"
      S3MP_WORKER_BATCH_SIZE: "10"
      S3MP_WORKER_MAX_ATTEMPTS: "5"
      S3MP_WORKER_LEASE_SECONDS: "60"
      S3MP_WORKER_RETENTION_DAYS: ${S3MP_WORKER_RETENTION_DAYS:-90}
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  knowledge-analysis-worker:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.knowledge.worker", "analysis"]
    environment: *runtime-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  knowledge-index-worker:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.knowledge.worker", "index"]
    environment: *runtime-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  platform-scheduler:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.platform.scheduler"]
    environment:
      <<: *runtime-environment
      S3MP_SUPPORT_EXPIRY_INTERVAL_SECONDS: "60"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  file-retention-scheduler:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.files.retention_scheduler"]
    environment:
      <<: *runtime-environment
      S3MP_WORKER_BATCH_SIZE: "100"
      S3MP_WORKER_MAX_ATTEMPTS: "5"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  api-observability-worker:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.governance.api_observability_worker"]
    environment:
      <<: *runtime-environment
      S3MP_WORKER_BATCH_SIZE: "100"
      S3MP_API_OBSERVABILITY_ERROR_RETENTION_DAYS: ${S3MP_API_OBSERVABILITY_ERROR_RETENTION_DAYS:-90}
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  dashboard-summary-scheduler:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    command: ["python", "-m", "s3mp.governance.dashboard_scheduler"]
    environment:
      <<: *runtime-environment
      S3MP_DASHBOARD_SUMMARY_INTERVAL_SECONDS: "3600"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  bootstrap:
    image: ${S3MP_APP_IMAGE:-s3mp:latest}
    entrypoint: []
    command: ["python", "-m", "scripts.ensure_platform_admin"]
    environment:
      <<: *runtime-environment
      S3MP_BOOTSTRAP_ADMIN_ENABLED: ${S3MP_BOOTSTRAP_ADMIN_ENABLED:-true}
      S3MP_BOOTSTRAP_ADMIN_EMAIL: ${S3MP_BOOTSTRAP_ADMIN_EMAIL:-}
      S3MP_BOOTSTRAP_ADMIN_EMPLOYEE_NUMBER: ${S3MP_BOOTSTRAP_ADMIN_EMPLOYEE_NUMBER:-}
      S3MP_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${S3MP_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      S3MP_BOOTSTRAP_ADMIN_PASSWORD: ${S3MP_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: s3mp
      POSTGRES_USER: s3mp
      POSTGRES_PASSWORD: ${S3MP_POSTGRES_PASSWORD:?set S3MP_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/00-database-owner.sql:/docker-entrypoint-initdb.d/00-database-owner.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3mp -d s3mp"]
      interval: 5s
      timeout: 3s
      retries: 20
#      解决服务器内核兼容问题
    security_opt:
      - seccomp=unconfined

  redis:
    image: redis:7-alpine
    environment:
      S3MP_REDIS_PASSWORD: ${S3MP_REDIS_PASSWORD:?set S3MP_REDIS_PASSWORD}
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --requirepass \"$${S3MP_REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${S3MP_REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${S3MP_RABBITMQ_USER:-s3mp_app}
      RABBITMQ_DEFAULT_PASS: ${S3MP_RABBITMQ_PASSWORD:?set S3MP_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
