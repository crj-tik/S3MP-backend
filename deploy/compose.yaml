x-s3mp-runtime-environment: &s3mp-runtime-environment
  S3MP_ENVIRONMENT: development
  S3MP_DATABASE_URL_FILE: /run/secrets/database_url
  # Keep Docker-internal endpoints separate from deploy/.env, whose values
  # are intended for processes started directly on the Windows host.
  S3MP_REDIS_URL: ${S3MP_DOCKER_REDIS_URL:-redis://redis:6379/0}
  # MinIO is started by local-s3/compose.yaml, outside this Compose project.
  # host.docker.internal reaches the Windows host from API and worker containers.
  S3MP_S3_ENDPOINT: ${S3MP_DOCKER_S3_ENDPOINT:-http://host.docker.internal:9000}
  S3MP_S3_REGION: ${S3MP_S3_REGION:-us-east-1}
  S3MP_S3_PATH_STYLE: ${S3MP_S3_PATH_STYLE:-true}
  S3MP_S3_BUCKET: ${S3MP_S3_BUCKET:-s3mp-dev}
  S3MP_S3_ACCESS_KEY: ${S3MP_S3_ACCESS_KEY:-s3mp-app}
  S3MP_S3_SECRET_KEY: ${S3MP_S3_SECRET_KEY:-bk-s3mp-backend}
  S3MP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
  S3MP_API_KEY_PEPPER_VERSION: ${S3MP_API_KEY_PEPPER_VERSION:-1}

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *s3mp-runtime-environment
      S3MP_LOG_LEVEL: INFO
      S3MP_READINESS_TIMEOUT_SECONDS: "2"
    secrets: [database_url, api_key_pepper]
    ports: ["19101:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "s3mp.files.worker"]
    environment:
      <<: *s3mp-runtime-environment
      S3MP_WORKER_POLL_SECONDS: "5"
      S3MP_WORKER_BATCH_SIZE: "10"
      S3MP_WORKER_MAX_ATTEMPTS: "5"
      S3MP_WORKER_LEASE_SECONDS: "60"
      S3MP_WORKER_RETENTION_DAYS: "30"
    secrets: [database_url, api_key_pepper]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "s3mp.files.worker", "--once", "--limit", "1"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: s3mp
      POSTGRES_USER: s3mp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3mp -d s3mp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  api_key_pepper:
    file: ./secrets/api_key_pepper

volumes:
  postgres-data:
  redis-data:
